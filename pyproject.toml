[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rvc-python"
version = "0.2.0"
authors = [
  { name="daswer123", email="daswerq123@gmail.com" },
]
description = "RVC inference and FastAPI service for Pandrator"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
  "ffmpeg-python",
  "soundfile",
  "omegaconf==2.3.0",
  "requests",
  "pyworld",
  "torchcrepe",
  "praat-parselmouth>=0.4.2",
  "numpy<=1.23.5",
  "faiss-cpu==1.7.3",
  "av",
  "loguru",
  "uvicorn",
  "fastapi",
  "pydantic",
  "python-multipart",
  "setuptools<81",
  "hydra-core>=1.3.2",
  "cffi",
  "cython",
  "regex",
  "sacrebleu>=1.4.12",
  "tqdm",
  "bitarray",
  "scikit-learn",
  "packaging",
]

[dependency-groups]
cpu = [
  "torch==2.3.1",
  "torchvision==0.18.1",
  "torchaudio==2.3.1",
]
cuda = [
  "torch==2.3.1",
  "torchvision==0.18.1",
  "torchaudio==2.3.1",
]

[project.urls]
Homepage = "https://github.com/lukaszliniewicz/rvc-python"
"Bug Tracker" = "https://github.com/lukaszliniewicz/rvc-python/issues"

[tool.hatch.build.targets.wheel]
only-include=["rvc_python"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
requires-pixi = ">=0.68.0"

[tool.pixi.dependencies]
python = "3.11.*"
pip = "24.*"
ffmpeg = "*"
setuptools = "<81"

[tool.pixi.pypi-dependencies]
rvc-python = { path = ".", editable = true }

[tool.pixi.pypi-options]
index-url = "https://pypi.org/simple"

[tool.pixi.feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[tool.pixi.feature.cuda.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu121"]

[tool.pixi.feature.test.pypi-dependencies]
pytest = "*"
httpx = "*"

[tool.pixi.feature.test.tasks]
test = "pytest -q"

[tool.pixi.environments]
default = ["cuda"]
cpu = ["cpu"]
test = ["cpu", "test"]

[tool.pixi.tasks]
start = "python run.py"
prepare = "python run.py --prepare-only"
